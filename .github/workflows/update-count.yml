name: Update merged PR count

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-count
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api 'search/issues?q=type:pr+author:sharadvc+is:merged&per_page=100' --paginate \
            --jq '.items[] | .repository_url' | grep -vi '/repos/sharadvc/' | wc -l | tr -d ' ')
          echo "merged into others' repos: $count"
          if [ "$count" -gt 0 ]; then
            sed -i -E "s|\*\*[0-9]+ merged\*\*|**${count} merged**|" README.md
          else
            echo "count was 0 — likely a rate limit, not updating"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update merged count [skip ci]"
            git push
          fi
